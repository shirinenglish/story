<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notebook</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="site-head">
    <a class="title" id="title" href="index.html"></a>
    <div class="tagline" id="tagline"></div>
    <div class="ornament">～ ～ ～</div>
    <p class="about" id="about"></p>
  </header>

  <nav class="tabs" id="tabs">
    <button class="on" data-k="all">All</button>
    <button data-k="story">Stories</button>
    <button data-k="longread">Long reads</button>
  </nav>

  <ul class="list" id="list"><li class="empty" style="border:0">Opening the notebook…</li></ul>

  <footer class="site-foot" id="foot"></footer>
</div>

<script>
(async function () {
  const { S, esc, niceDate, minutes, KIND, loadIndex } = App;
  document.title = S.title;
  document.getElementById("title").textContent = S.title;
  document.getElementById("tagline").textContent = S.tagline;
  document.getElementById("about").textContent = S.about || "";
  document.getElementById("foot").textContent = "© " + new Date().getFullYear() + " " + S.author;

  const list = document.getElementById("list");
  let posts = [];
  let filter = "all";

  function draw() {
    const shown = posts.filter(p => filter === "all" || p.type === filter);
    if (!shown.length) {
      list.innerHTML = '<li class="empty" style="border:0">' +
        (posts.length ? "Nothing here yet." : "The first story is coming soon.") + "</li>";
      return;
    }
    list.innerHTML = shown.map(p =>
      '<li><a href="' + App.link(p.slug) + '">' +
        '<div class="kind">' + esc(KIND[p.type] || "Story") + "</div>" +
        "<h2>" + esc(p.title) + "</h2>" +
        (p.subtitle ? '<p class="sub">' + esc(p.subtitle) + "</p>" : "") +
        '<p class="excerpt">' + esc(p.excerpt || "") + "</p>" +
        '<div class="meta">' + esc(niceDate(p.date)) + " · " + minutes(p.words || 0) + " min read</div>" +
      "</a></li>").join("");
  }

  document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.k;
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    draw();
  });

  try {
    posts = await loadIndex();
    posts.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    draw();
  } catch (e) {
    list.innerHTML = '<li class="empty" style="border:0">Could not open the notebook right now. Please try again.</li>';
  }
})();
</script>
</body>
</html>
